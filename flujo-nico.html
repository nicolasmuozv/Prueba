<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mi Flujo">
  <meta name="theme-color" content="#08080E">
  <title>Mi Flujo 2026</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

    :root{
      --bg:#08080E;
      --s1:#0D0D16;
      --s2:#12121C;
      --s3:#181824;
      --border:rgba(255,255,255,0.055);
      --border2:rgba(255,255,255,0.10);
      --gold:#C8A96E;
      --gold2:#E2C98A;
      --text:#EEEEF2;
      --text2:#7B7E96;
      --text3:#44465A;
      --green:#3ECF8E;
      --red:#EF6461;
      --nav-h:64px;
    }

    html,body{
      height:100%;min-height:100dvh;
      background:var(--bg);color:var(--text);
      font-family:'Inter',system-ui,sans-serif;
      overflow-x:hidden;
    }

    /* ── LAYOUT ── */
    .screen{display:none;min-height:100dvh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 8px);}
    .screen.active{display:block;}
    .wrap{max-width:480px;margin:0 auto;padding:0 20px;}

    /* ── BOTTOM NAV ── */
    .nav{
      position:fixed;bottom:0;left:0;right:0;z-index:100;
      height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));
      padding-bottom:env(safe-area-inset-bottom,0px);
      background:rgba(8,8,14,0.92);
      backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
      border-top:1px solid var(--border);
    }
    .nav-row{display:flex;height:var(--nav-h);}
    .nav-btn{
      flex:1;display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:5px;background:none;border:none;
      color:var(--text3);font-size:10px;font-weight:500;cursor:pointer;
      font-family:'Inter',sans-serif;letter-spacing:.4px;text-transform:uppercase;
      transition:color .2s;position:relative;
    }
    .nav-btn.active{color:var(--text);}
    .nav-btn.active::after{
      content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
      width:20px;height:1px;background:var(--gold);
    }
    .nav-icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center;}
    .nav-icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}

    /* ── SECTION HEADER ── */
    .s-header{
      padding:calc(env(safe-area-inset-top,0px) + 28px) 0 20px;
    }
    .s-label{font-size:10px;font-weight:600;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;}
    .s-title{font-size:28px;font-weight:700;letter-spacing:-.5px;}

    /* ── HERO BALANCE ── */
    .hero{
      padding:calc(env(safe-area-inset-top,0px) + 32px) 20px 28px;
      max-width:480px;margin:0 auto;
    }
    .hero-label{font-size:10px;font-weight:600;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:10px;}
    .hero-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border2),transparent);}
    .hero-amount{
      font-size:52px;font-weight:700;letter-spacing:-2.5px;line-height:1;
      color:var(--text);margin-bottom:8px;
      font-variant-numeric:tabular-nums;
    }
    .hero-amount.neg{color:var(--red);}
    .hero-meta{display:flex;align-items:center;justify-content:space-between;margin-top:16px;}
    .hero-month{font-size:13px;color:var(--text2);font-weight:400;}
    .hero-nav{display:flex;gap:2px;}
    .hero-nav-btn{
      width:28px;height:28px;border-radius:6px;
      background:var(--s2);border:1px solid var(--border);
      color:var(--text2);font-size:15px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:all .15s;font-weight:300;
    }
    .hero-nav-btn:active{background:var(--s3);color:var(--text);}

    /* ── DIVIDER ── */
    .divider{height:1px;background:var(--border);margin:0 20px;}

    /* ── METRIC ROW ── */
    .metrics{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);margin-bottom:1px;}
    .metric{background:var(--bg);padding:18px 20px;}
    .metric-label{font-size:10px;font-weight:500;color:var(--text3);letter-spacing:.8px;text-transform:uppercase;margin-bottom:6px;}
    .metric-val{font-size:20px;font-weight:600;letter-spacing:-.5px;font-variant-numeric:tabular-nums;}
    .metric-val.pos{color:var(--green);}
    .metric-val.neg{color:var(--red);}
    .metric-sub{font-size:11px;color:var(--text3);margin-top:3px;font-variant-numeric:tabular-nums;}

    /* ── SECTION LABEL ── */
    .sec{
      padding:24px 20px 12px;
      font-size:10px;font-weight:600;color:var(--text3);
      letter-spacing:1.5px;text-transform:uppercase;
      display:flex;align-items:center;gap:12px;
    }
    .sec::after{content:'';flex:1;height:1px;background:var(--border);}

    /* ── CATEGORY ROW ── */
    .cat-row{
      display:flex;align-items:center;gap:14px;
      padding:13px 20px;border-bottom:1px solid var(--border);
      transition:background .1s;
    }
    .cat-row:last-child{border-bottom:none;}
    .cat-row:active{background:var(--s1);}
    .cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
    .cat-body{flex:1;min-width:0;}
    .cat-name{font-size:13px;font-weight:400;color:var(--text);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .cat-track{height:2px;background:var(--s3);border-radius:2px;overflow:hidden;}
    .cat-fill{height:100%;border-radius:2px;transition:width .5s cubic-bezier(.4,0,.2,1);}
    .cat-right{text-align:right;flex-shrink:0;min-width:80px;}
    .cat-real{font-size:13px;font-weight:500;letter-spacing:-.3px;font-variant-numeric:tabular-nums;}
    .cat-ppto{font-size:11px;color:var(--text3);margin-top:2px;font-variant-numeric:tabular-nums;}

    /* ── ALERT ── */
    .alert{margin:0 20px 0;border-radius:0;padding:12px 0;font-size:12px;line-height:1.5;color:var(--text2);border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start;}
    .alert-dot{width:6px;height:6px;border-radius:50%;margin-top:4px;flex-shrink:0;}
    .alert.ok .alert-dot{background:var(--green);}
    .alert.warn .alert-dot{background:#F59E0B;}
    .alert.danger .alert-dot{background:var(--red);}
    .alert strong{color:var(--text);font-weight:600;}

    /* ── EXPORT BTN ── */
    .export-row{padding:20px 20px 0;}
    .btn-export{
      width:100%;padding:14px;
      background:none;border:1px solid var(--border2);
      border-radius:10px;color:var(--text2);
      font-size:13px;font-weight:500;cursor:pointer;
      font-family:'Inter',sans-serif;letter-spacing:.3px;
      transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;
    }
    .btn-export:active{background:var(--s2);color:var(--text);}
    .btn-export svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}

    /* ── FORM ── */
    .form-wrap{padding:0 20px;}
    .fg{margin-bottom:20px;}
    .fg label{display:block;font-size:10px;font-weight:600;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
    .fi,.fs{
      width:100%;background:var(--s1);
      border:1px solid var(--border2);border-radius:8px;
      padding:12px 14px;color:var(--text);font-size:15px;
      outline:none;-webkit-appearance:none;appearance:none;
      font-family:'Inter',sans-serif;
      transition:border-color .15s;
    }
    .fi:focus,.fs:focus{border-color:rgba(200,169,110,0.4);}
    .fi::placeholder{color:var(--text3);}
    select option{background:#0D0D16;color:#EEEEF2;}

    .type-row{display:flex;gap:8px;}
    .type-btn{
      flex:1;padding:11px 8px;border-radius:8px;
      background:var(--s1);border:1px solid var(--border);
      color:var(--text2);font-size:12px;font-weight:600;
      cursor:pointer;font-family:'Inter',sans-serif;
      letter-spacing:.3px;text-transform:uppercase;
      transition:all .2s;text-align:center;
    }
    .type-btn.active-g{background:rgba(239,100,97,.12);border-color:rgba(239,100,97,.3);color:var(--red);}
    .type-btn.active-i{background:rgba(62,207,142,.1);border-color:rgba(62,207,142,.25);color:var(--green);}

    .btn-submit{
      width:100%;padding:14px;
      background:var(--gold);border:none;border-radius:8px;
      color:#08080E;font-size:14px;font-weight:700;
      cursor:pointer;font-family:'Inter',sans-serif;letter-spacing:.5px;text-transform:uppercase;
      transition:opacity .2s;margin-top:4px;
    }
    .btn-submit:active{opacity:.85;}

    /* ── MONTH CHIPS ── */
    .chips{display:flex;gap:6px;overflow-x:auto;padding:0 20px 16px;scrollbar-width:none;}
    .chips::-webkit-scrollbar{display:none;}
    .chip{
      padding:6px 14px;border-radius:20px;
      background:none;border:1px solid var(--border);
      color:var(--text3);font-size:11px;font-weight:500;
      cursor:pointer;white-space:nowrap;font-family:'Inter',sans-serif;
      letter-spacing:.3px;transition:all .15s;
    }
    .chip.active{border-color:var(--gold);color:var(--gold);}

    /* ── FILTER ── */
    .filter-row{display:flex;gap:6px;padding:0 20px 16px;}
    .f-btn{
      padding:5px 13px;border-radius:20px;
      border:1px solid var(--border);background:none;
      color:var(--text3);font-size:11px;font-weight:500;
      cursor:pointer;font-family:'Inter',sans-serif;letter-spacing:.3px;
      transition:all .15s;
    }
    .f-btn.active{border-color:var(--border2);color:var(--text);background:var(--s2);}

    /* ── TRANSACTION LIST ── */
    .tx{
      display:flex;align-items:center;gap:14px;
      padding:13px 20px;border-bottom:1px solid var(--border);
      transition:background .1s;
    }
    .tx:last-child{border-bottom:none;}
    .tx:active{background:var(--s1);}
    .tx-bar{width:3px;height:32px;border-radius:2px;flex-shrink:0;}
    .tx-info{flex:1;min-width:0;}
    .tx-desc{font-size:14px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .tx-cat{font-size:11px;color:var(--text3);margin-top:2px;}
    .tx-right{text-align:right;flex-shrink:0;}
    .tx-amt{font-size:14px;font-weight:500;letter-spacing:-.3px;font-variant-numeric:tabular-nums;}
    .tx-amt.neg{color:var(--red);}
    .tx-amt.pos{color:var(--green);}
    .tx-date{font-size:11px;color:var(--text3);margin-top:2px;}
    .tx-del{background:none;border:none;color:var(--text3);font-size:14px;cursor:pointer;padding:6px 4px;flex-shrink:0;transition:color .15s;}
    .tx-del:active{color:var(--red);}

    /* ── RESUMEN ── */
    .res-sec{padding:20px 20px 8px;font-size:10px;font-weight:600;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;}
    .res-row{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;border-bottom:1px solid var(--border);font-size:13px;}
    .res-row:last-child{border-bottom:none;}
    .res-name{color:var(--text2);flex:1;font-weight:400;}
    .res-ppto{color:var(--text3);text-align:right;min-width:80px;font-size:11px;font-variant-numeric:tabular-nums;}
    .res-real{font-weight:500;text-align:right;min-width:80px;font-variant-numeric:tabular-nums;}
    .res-total-row{
      display:flex;justify-content:space-between;align-items:center;
      padding:13px 20px;background:var(--s1);
      border-bottom:1px solid var(--border);
      font-size:13px;font-weight:600;
    }

    /* ── MONTH NAV (resumen) ── */
    .m-nav{display:flex;align-items:center;justify-content:space-between;padding:0 20px 20px;}
    .m-nav-btn{width:32px;height:32px;border-radius:6px;background:var(--s2);border:1px solid var(--border);color:var(--text2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
    .m-nav-btn:active{background:var(--s3);}
    .m-nav-title{font-size:18px;font-weight:600;letter-spacing:-.3px;}

    /* ── TOAST ── */
    .toast{
      position:fixed;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px);
      left:50%;transform:translateX(-50%) translateY(8px);
      background:var(--s3);border:1px solid var(--border2);
      color:var(--text);padding:10px 18px;border-radius:6px;
      font-size:12px;font-weight:500;letter-spacing:.3px;
      opacity:0;transition:all .25s;z-index:300;
      pointer-events:none;white-space:nowrap;font-family:'Inter',sans-serif;
      text-transform:uppercase;
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    .toast.err{border-color:rgba(239,100,97,.3);color:var(--red);}

    /* ── EMPTY ── */
    .empty{padding:60px 20px;text-align:center;color:var(--text3);font-size:13px;line-height:1.6;}

    /* ── FADE IN ── */
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
    .screen.active .hero,
    .screen.active .metrics,
    .screen.active .alert,
    .screen.active .sec,
    .screen.active .divider,
    .screen.active .s-header,
    .screen.active .form-wrap,
    .screen.active .chips,
    .screen.active .filter-row,
    .screen.active .m-nav,
    .screen.active .export-row
    {animation:fadeIn .25s ease both;}
  </style>
</head>
<body>

<!-- ══════════ INICIO ══════════ -->
<div id="s-inicio" class="screen active">
  <div class="hero">
    <div class="hero-label">Saldo estimado</div>
    <div class="hero-amount" id="ini-saldo">—</div>
    <div class="hero-meta">
      <div class="hero-month" id="ini-month">Mayo 2026</div>
      <div class="hero-nav">
        <button class="hero-nav-btn" onclick="cambiarMesIni(-1)">&#8249;</button>
        <button class="hero-nav-btn" onclick="cambiarMesIni(1)">&#8250;</button>
      </div>
    </div>
  </div>

  <div id="ini-alert-wrap"></div>

  <div class="metrics" id="ini-metrics">
    <div class="metric"><div class="metric-label">Ingresos</div><div class="metric-val pos" id="ini-ing">—</div><div class="metric-sub" id="ini-ing-sub">—</div></div>
    <div class="metric"><div class="metric-label">Gastos</div><div class="metric-val neg" id="ini-gas">—</div><div class="metric-sub" id="ini-gas-sub">—</div></div>
    <div class="metric"><div class="metric-label">Flujo neto</div><div class="metric-val" id="ini-neto">—</div><div class="metric-sub">del mes</div></div>
    <div class="metric"><div class="metric-label">Ahorro</div><div class="metric-val" id="ini-aho">—</div><div class="metric-sub" id="ini-aho-sub">—</div></div>
  </div>

  <div class="sec">Ingresos</div>
  <div id="ini-ing-rows"></div>

  <div class="sec">Gastos variables</div>
  <div id="ini-var-rows"></div>

  <div class="sec">Gastos fijos</div>
  <div id="ini-fij-rows"></div>

  <div class="sec">Ahorro</div>
  <div id="ini-aho-rows"></div>

  <div class="export-row">
    <button class="btn-export" onclick="exportarExcel()">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Exportar Excel actualizado
    </button>
  </div>
  <div style="height:12px;"></div>
</div>

<!-- ══════════ AGREGAR ══════════ -->
<div id="s-agregar" class="screen">
  <div class="wrap">
    <div class="s-header">
      <div class="s-label">Nuevo movimiento</div>
      <div class="s-title">Agregar</div>
    </div>
  </div>
  <div class="form-wrap">
    <div class="fg">
      <label>Tipo</label>
      <div class="type-row">
        <button class="type-btn active-g" id="btn-gasto" onclick="setTipo('gasto')">Gasto</button>
        <button class="type-btn" id="btn-ingreso" onclick="setTipo('ingreso')">Ingreso</button>
      </div>
    </div>
    <div class="fg"><label>Fecha</label><input class="fi" type="date" id="f-fecha"></div>
    <div class="fg">
      <label>Mes del flujo</label>
      <select class="fs" id="f-mes">
        <option value="0">Mayo 2026</option><option value="1">Junio 2026</option>
        <option value="2">Julio 2026</option><option value="3">Agosto 2026</option>
        <option value="4">Septiembre 2026</option><option value="5">Octubre 2026</option>
        <option value="6">Noviembre 2026</option><option value="7">Diciembre 2026</option>
      </select>
    </div>
    <div class="fg"><label>Categoría</label><select class="fs" id="f-cat"></select></div>
    <div class="fg"><label>Descripción</label><input class="fi" type="text" id="f-desc" placeholder="Ej: Almuerzo, bencina..."></div>
    <div class="fg"><label>Monto</label><input class="fi" type="number" id="f-monto" placeholder="0" min="1" inputmode="numeric"></div>
    <button class="btn-submit" onclick="guardarTransaccion()">Guardar</button>
  </div>
</div>

<!-- ══════════ HISTORIAL ══════════ -->
<div id="s-historial" class="screen">
  <div class="wrap">
    <div class="s-header">
      <div class="s-label">Movimientos</div>
      <div class="s-title">Historial</div>
    </div>
  </div>
  <div class="chips" id="hist-chips"></div>
  <div class="filter-row">
    <button class="f-btn active" id="fb-todo" onclick="setFiltro('todo')">Todos</button>
    <button class="f-btn" id="fb-gasto" onclick="setFiltro('gasto')">Gastos</button>
    <button class="f-btn" id="fb-ingreso" onclick="setFiltro('ingreso')">Ingresos</button>
  </div>
  <div id="hist-lista"></div>
</div>

<!-- ══════════ RESUMEN ══════════ -->
<div id="s-resumen" class="screen">
  <div class="wrap">
    <div class="s-header">
      <div class="s-label">Análisis mensual</div>
      <div class="s-title">Resumen</div>
    </div>
  </div>
  <div class="m-nav">
    <button class="m-nav-btn" onclick="cambiarMesRes(-1)">&#8249;</button>
    <span class="m-nav-title" id="res-mes-nombre"></span>
    <button class="m-nav-btn" onclick="cambiarMesRes(1)">&#8250;</button>
  </div>
  <div id="res-alert-wrap"></div>
  <div id="res-tabla"></div>
</div>

<!-- ── BOTTOM NAV ── -->
<nav class="nav">
  <div class="nav-row">
    <button class="nav-btn active" id="nb-inicio" onclick="showScreen('inicio')">
      <div class="nav-icon">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </div>
      Inicio
    </button>
    <button class="nav-btn" id="nb-agregar" onclick="showScreen('agregar')">
      <div class="nav-icon">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      </div>
      Agregar
    </button>
    <button class="nav-btn" id="nb-historial" onclick="showScreen('historial')">
      <div class="nav-icon">
        <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      </div>
      Historial
    </button>
    <button class="nav-btn" id="nb-resumen" onclick="showScreen('resumen')">
      <div class="nav-icon">
        <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      </div>
      Resumen
    </button>
  </div>
</nav>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════
//  DATOS
// ══════════════════════════════════════
const MONTHS=['May 2026','Jun 2026','Jul 2026','Ago 2026','Sep 2026','Oct 2026','Nov 2026','Dic 2026'];
const MONTHS_FULL=['Mayo 2026','Junio 2026','Julio 2026','Agosto 2026','Septiembre 2026','Octubre 2026','Noviembre 2026','Diciembre 2026'];

let currentTipo='gasto',mesIni=0,mesRes=0,mesHist=0,filtroHist='todo';

function loadData(){const r=localStorage.getItem('flujoNico2026');if(!r){saveData(TX_INICIALES);return TX_INICIALES;}return JSON.parse(r);}
function saveData(t){localStorage.setItem('flujoNico2026',JSON.stringify(t));}
function getAll(){return loadData();}
function addTx(t){const a=getAll();a.push(t);saveData(a);}
function deleteTx(id){saveData(getAll().filter(t=>t.id!==id));}
function clp(n){if(n===null||n===undefined)return'—';const s='$ '+Math.abs(n).toLocaleString('es-CL');return n<0?'-'+s:s;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function sumCat(txs,cat,mes,tipo){return txs.filter(t=>t.cat===cat&&t.mes===mes&&t.tipo===tipo).reduce((s,t)=>s+t.monto,0);}
function sumGrupo(txs,g,mes,tipo){return Object.keys(g).reduce((s,c)=>s+sumCat(txs,c,mes,tipo),0);}
function detectarMes(d){if(d.getFullYear()===2026&&d.getMonth()>=4&&d.getMonth()<=11)return d.getMonth()-4;return 0;}
function showToast(msg,err=false){const t=document.getElementById('toast');t.textContent=msg;t.className='toast'+(err?' err':'');void t.offsetWidth;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function formatFecha(s){if(!s)return'';const[y,m,d]=s.split('-');const mn=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];return`${parseInt(d)} ${mn[parseInt(m)-1]}`;}

function fillColor(p){if(p<70)return'#3ECF8E';if(p<95)return'#C8A96E';if(p<110)return'#F97316';return'#EF6461';}

function showScreen(n){
  ['inicio','agregar','historial','resumen'].forEach(x=>{
    document.getElementById('s-'+x).classList.toggle('active',x===n);
    document.getElementById('nb-'+x).classList.toggle('active',x===n);
  });
  if(n==='inicio')renderInicio();
  if(n==='agregar')initAgregar();
  if(n==='historial')renderHistorial();
  if(n==='resumen')renderResumen();
}

function cambiarMesIni(d){mesIni=Math.max(0,Math.min(7,mesIni+d));renderInicio();}

function renderInicio(){
  const txs=getAll();const m=mesIni;
  let sI=SALDO_INI_MAY;
  for(let i=0;i<m;i++)sI+=sumGrupo(txs,PPTO.ingresos,i,'ingreso')-sumGrupo(txs,PPTO.fijos,i,'gasto')-sumGrupo(txs,PPTO.variables,i,'gasto')-sumGrupo(txs,PPTO.ahorro,i,'gasto');
  const ingR=sumGrupo(txs,PPTO.ingresos,m,'ingreso');
  const gasR=sumGrupo(txs,PPTO.fijos,m,'gasto')+sumGrupo(txs,PPTO.variables,m,'gasto')+sumGrupo(txs,PPTO.ahorro,m,'gasto');
  const ahoR=sumGrupo(txs,PPTO.ahorro,m,'gasto');
  const ingP=Object.values(PPTO.ingresos).reduce((s,a)=>s+a[m],0);
  const gasP=Object.values(PPTO.fijos).reduce((s,a)=>s+a[m],0)+Object.values(PPTO.variables).reduce((s,a)=>s+a[m],0)+Object.values(PPTO.ahorro).reduce((s,a)=>s+a[m],0);
  const ahoP=Object.values(PPTO.ahorro).reduce((s,a)=>s+a[m],0);
  const neto=ingR-gasR;const sF=sI+neto;

  const $s=document.getElementById('ini-saldo');
  $s.textContent=clp(sF);$s.className='hero-amount'+(sF<0?' neg':'');
  document.getElementById('ini-month').textContent=MONTHS_FULL[m]+(m===0?' · en curso':'');

  document.getElementById('ini-ing').textContent=clp(ingR);
  document.getElementById('ini-ing-sub').textContent='Ppto '+clp(ingP);
  document.getElementById('ini-gas').textContent=clp(gasR);
  document.getElementById('ini-gas-sub').textContent='Ppto '+clp(gasP);
  const $n=document.getElementById('ini-neto');$n.textContent=clp(neto);
  $n.className='metric-val'+(neto>=0?' pos':' neg');
  document.getElementById('ini-aho').textContent=clp(ahoR);
  document.getElementById('ini-aho-sub').textContent='Ppto '+clp(ahoP);

  const pctG=gasP?Math.round((gasR/gasP)*100):0;
  const $al=document.getElementById('ini-alert-wrap');
  if(pctG>100)$al.innerHTML=`<div class="alert danger"><div class="alert-dot"></div><div>Llevas el <strong>${pctG}%</strong> del presupuesto de gastos en ${MONTHS[m]}.</div></div>`;
  else if(pctG>80)$al.innerHTML=`<div class="alert warn"><div class="alert-dot"></div><div>Llevas el <strong>${pctG}%</strong> del presupuesto. Queda poco margen.</div></div>`;
  else if(neto>0)$al.innerHTML=`<div class="alert ok"><div class="alert-dot"></div><div>Flujo positivo de <strong>${clp(neto)}</strong> en ${MONTHS[m]}.</div></div>`;
  else $al.innerHTML='';

  document.getElementById('ini-ing-rows').innerHTML=makeRows(txs,PPTO.ingresos,m,'ingreso');
  document.getElementById('ini-var-rows').innerHTML=makeRows(txs,PPTO.variables,m,'gasto');
  document.getElementById('ini-fij-rows').innerHTML=makeRows(txs,PPTO.fijos,m,'gasto');
  document.getElementById('ini-aho-rows').innerHTML=makeRows(txs,PPTO.ahorro,m,'gasto');
}

function makeRows(txs,grupo,m,tipo){
  let html='';
  for(const[cat,arr]of Object.entries(grupo)){
    const real=sumCat(txs,cat,m,tipo);const ppto=arr[m];
    if(ppto===0&&real===0)continue;
    const p=ppto?Math.min(Math.round((real/ppto)*100),100):real>0?100:0;
    const col=CAT_COLOR[cat]||'#6B7280';
    const barCol=tipo==='ingreso'?col:fillColor(p);
    html+=`<div class="cat-row">
      <div class="cat-dot" style="background:${col};"></div>
      <div class="cat-body">
        <div class="cat-name">${cat}</div>
        <div class="cat-track"><div class="cat-fill" style="width:${p}%;background:${barCol};"></div></div>
      </div>
      <div class="cat-right">
        <div class="cat-real">${clp(real)}</div>
        <div class="cat-ppto">${clp(ppto)}</div>
      </div>
    </div>`;
  }
  return html||'<div style="padding:12px 20px;font-size:12px;color:var(--text3);">Sin movimientos este mes</div>';
}

function initAgregar(){
  const h=new Date();
  document.getElementById('f-fecha').value=`${h.getFullYear()}-${String(h.getMonth()+1).padStart(2,'0')}-${String(h.getDate()).padStart(2,'0')}`;
  document.getElementById('f-mes').value=detectarMes(h);
  setTipo(currentTipo);updateCats();
}
function setTipo(t){
  currentTipo=t;
  document.getElementById('btn-gasto').className='type-btn'+(t==='gasto'?' active-g':'');
  document.getElementById('btn-ingreso').className='type-btn'+(t==='ingreso'?' active-i':'');
  updateCats();
}
function updateCats(){
  const s=document.getElementById('f-cat');s.innerHTML='';
  const gs=currentTipo==='gasto'
    ?[{l:'Variables',c:Object.keys(PPTO.variables)},{l:'Fijos',c:Object.keys(PPTO.fijos)},{l:'Ahorro',c:Object.keys(PPTO.ahorro)}]
    :[{l:'Ingresos',c:Object.keys(PPTO.ingresos)}];
  for(const g of gs){const o=document.createElement('optgroup');o.label=g.l;for(const c of g.c){const op=document.createElement('option');op.value=c;op.textContent=c;o.appendChild(op);}s.appendChild(o);}
}
function guardarTransaccion(){
  const fecha=document.getElementById('f-fecha').value;
  const mes=parseInt(document.getElementById('f-mes').value);
  const cat=document.getElementById('f-cat').value;
  const desc=document.getElementById('f-desc').value.trim();
  const monto=parseFloat(document.getElementById('f-monto').value);
  if(!fecha){showToast('Falta la fecha',true);return;}
  if(!desc){showToast('Falta la descripción',true);return;}
  if(!monto||monto<=0){showToast('Monto inválido',true);return;}
  addTx({id:uid(),fecha,desc,monto,cat,tipo:currentTipo,mes});
  showToast(currentTipo==='gasto'?'Gasto guardado':'Ingreso guardado');
  document.getElementById('f-desc').value='';document.getElementById('f-monto').value='';
}

function renderHistorial(){
  document.getElementById('hist-chips').innerHTML=MONTHS.map((mn,i)=>`<div class="chip${i===mesHist?' active':''}" onclick="setMesHist(${i})">${mn}</div>`).join('');
  const txs=getAll().filter(t=>t.mes===mesHist).filter(t=>filtroHist==='todo'||t.tipo===filtroHist).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const $l=document.getElementById('hist-lista');
  if(!txs.length){$l.innerHTML='<div class="empty">Sin movimientos en este mes</div>';return;}
  $l.innerHTML=txs.map(t=>`<div class="tx">
    <div class="tx-bar" style="background:${CAT_COLOR[t.cat]||'#6B7280'};"></div>
    <div class="tx-info"><div class="tx-desc">${t.desc}</div><div class="tx-cat">${t.cat}</div></div>
    <div class="tx-right">
      <div class="tx-amt ${t.tipo==='gasto'?'neg':'pos'}">${t.tipo==='gasto'?'−':'+'}${clp(t.monto)}</div>
      <div class="tx-date">${formatFecha(t.fecha)}</div>
    </div>
    <button class="tx-del" onclick="confirmarBorrar('${t.id}','${t.desc.replace(/'/g,"\\'")}')">&#10005;</button>
  </div>`).join('');
}
function setMesHist(i){mesHist=i;renderHistorial();}
function setFiltro(f){filtroHist=f;['todo','gasto','ingreso'].forEach(x=>document.getElementById('fb-'+x).classList.toggle('active',x===f));renderHistorial();}
function confirmarBorrar(id,desc){if(confirm(`¿Eliminar "${desc}"?`)){deleteTx(id);renderHistorial();showToast('Eliminado');}}

function cambiarMesRes(d){mesRes=Math.max(0,Math.min(7,mesRes+d));renderResumen();}
function renderResumen(){
  document.getElementById('res-mes-nombre').textContent=MONTHS_FULL[mesRes];
  const txs=getAll();const m=mesRes;
  const ingR=sumGrupo(txs,PPTO.ingresos,m,'ingreso');
  const fijR=sumGrupo(txs,PPTO.fijos,m,'gasto');
  const varR=sumGrupo(txs,PPTO.variables,m,'gasto');
  const ahoR=sumGrupo(txs,PPTO.ahorro,m,'gasto');
  const ingP=Object.values(PPTO.ingresos).reduce((s,a)=>s+a[m],0);
  const fijP=Object.values(PPTO.fijos).reduce((s,a)=>s+a[m],0);
  const varP=Object.values(PPTO.variables).reduce((s,a)=>s+a[m],0);
  const ahoP=Object.values(PPTO.ahorro).reduce((s,a)=>s+a[m],0);
  const gasR=fijR+varR+ahoR;const gasP=fijP+varP+ahoP;
  const netoR=ingR-gasR;const netoP=ingP-gasP;

  const $al=document.getElementById('res-alert-wrap');
  if(netoR<0)$al.innerHTML=`<div class="alert danger" style="margin-bottom:8px;"><div class="alert-dot"></div><div>Flujo negativo de <strong>${clp(netoR)}</strong></div></div>`;
  else if(netoR>=netoP)$al.innerHTML=`<div class="alert ok" style="margin-bottom:8px;"><div class="alert-dot"></div><div>Flujo mejor que el presupuestado</div></div>`;
  else $al.innerHTML='';

  function fila(n,r,p,isTotal=false,isSec=false){
    if(isSec)return`<div class="res-sec">${n}</div>`;
    if(isTotal){const c=r>=p?'var(--green)':'var(--red)';return`<div class="res-total-row"><span>${n}</span><span style="color:var(--text3);font-size:11px;font-weight:400;">${clp(p)}</span><span style="color:${c};">${clp(r)}</span></div>`;}
    return`<div class="res-row"><span class="res-name">${n}</span><span class="res-ppto">${clp(p)}</span><span class="res-real">${clp(r)}</span></div>`;
  }

  let html='<div style="display:flex;justify-content:flex-end;padding:0 20px 4px;font-size:10px;color:var(--text3);font-weight:500;letter-spacing:.5px;text-transform:uppercase;"><span style="min-width:80px;text-align:right;">Ppto</span><span style="min-width:80px;text-align:right;">Real</span></div>';
  html+=fila('Ingresos','','',false,true);
  for(const[c,a]of Object.entries(PPTO.ingresos))html+=fila(c,sumCat(txs,c,m,'ingreso'),a[m]);
  html+=fila('Total ingresos',ingR,ingP,true);
  html+=fila('Gastos fijos','','',false,true);
  for(const[c,a]of Object.entries(PPTO.fijos))html+=fila(c,sumCat(txs,c,m,'gasto'),a[m]);
  html+=fila('Subtotal fijos',fijR,fijP,true);
  html+=fila('Gastos variables','','',false,true);
  for(const[c,a]of Object.entries(PPTO.variables))html+=fila(c,sumCat(txs,c,m,'gasto'),a[m]);
  html+=fila('Subtotal variables',varR,varP,true);
  html+=fila('Ahorro','','',false,true);
  for(const[c,a]of Object.entries(PPTO.ahorro))html+=fila(c,sumCat(txs,c,m,'gasto'),a[m]);
  html+=fila('Subtotal ahorro',ahoR,ahoP,true);
  html+=fila('Flujo neto del mes',netoR,netoP,true);
  document.getElementById('res-tabla').innerHTML=html;
}

function csvRow(arr){
  return arr.map(v=>{
    const s=v===undefined||v===null?'':String(v);
    return s.includes(',')||s.includes('"')||s.includes('\n')?'"'+s.replace(/"/g,'""')+'"':s;
  }).join(',')+'\r\n';
}

    r.push(tp,tr);csv+=csvRow(r);csv+=csvRow([]);
  }
  {const r=['Flujo neto'];let tp=0,tr=0;
    for(let i=0;i<8;i++){
      const ingP=Object.values(PPTO.ingresos).reduce((s,a)=>s+a[i],0);
      const gasP=Object.values(PPTO.fijos).reduce((s,a)=>s+a[i],0)+Object.values(PPTO.variables).reduce((s,a)=>s+a[i],0)+Object.values(PPTO.ahorro).reduce((s,a)=>s+a[i],0);
      const ingR=sumGrupo(txs,PPTO.ingresos,i,'ingreso');
      const gasR=sumGrupo(txs,PPTO.fijos,i,'gasto')+sumGrupo(txs,PPTO.variables,i,'gasto')+sumGrupo(txs,PPTO.ahorro,i,'gasto');
      r.push(ingP-gasP,ingR-gasR);tp+=(ingP-gasP);tr+=(ingR-gasR);
    }
    r.push(tp,tr);csv+=csvRow(r);
  }
  csv+=csvRow([]);
  csv+=csvRow(['--- DETALLE DE MOVIMIENTOS ---']);
  csv+=csvRow(['Fecha','Descripción','Monto','Categoría','Tipo','Mes']);
  for(const t of[...txs].sort((a,b)=>a.mes-b.mes||a.fecha.localeCompare(b.fecha)))
    csv+=csvRow([t.fecha,t.desc,t.monto,t.cat,t.tipo==='gasto'?'Gasto':'Ingreso',MONTHS_FULL[t.mes]||t.mes]);
  try{
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='Flujo_Nico_2026.csv';
    document.body.appendChild(a);a.click();
    setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},1000);
    showToast('Archivo descargado');
  }catch(e){showToast('Error al exportar',true);}
}

(function(){
  const h=new Date();mesIni=mesRes=mesHist=detectarMes(h);
  loadData();renderInicio();
})();
