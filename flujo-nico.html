<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mi Flujo">
  <meta name="theme-color" content="#08080E">
  <title>Mi Flujo 2026</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

    :root{
      --bg:#08080E;
      --s1:#0D0D16;
      --s2:#12121C;
      --s3:#181824;
      --border:rgba(255,255,255,0.055);
      --border2:rgba(255,255,255,0.10);
      --gold:#C8A96E;
      --gold2:#E2C98A;
      --text:#EEEEF2;
      --text2:#7B7E96;
      --text3:#44465A;
      --green:#3ECF8E;
      --red:#EF6461;
      --nav-h:64px;
    }

    html,body{
      height:100%;min-height:100dvh;
      background:var(--bg);color:var(--text);
      font-family:'Inter',system-ui,sans-serif;
      overflow-x:hidden;
    }

    /* ── LAYOUT ── */
    .screen{display:none;min-height:100dvh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 8px);}
    .screen.active{display:block;}
    .wrap{max-width:480px;margin:0 auto;padding:0 20px;}

    /* ── BOTTOM NAV ── */
    .nav{
      position:fixed;bottom:0;left:0;right:0;z-index:100;
      height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));
      padding-bottom:env(safe-area-inset-bottom,0px);
      background:rgba(8,8,14,0.92);
      backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
      border-top:1px solid var(--border);
    }
    .nav-row{display:flex;height:var(--nav-h);}
    .nav-btn{
      flex:1;display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:5px;background:none;border:none;
      color:var(--text3);font-size:10px;font-weight:500;cursor:pointer;
      font-family:'Inter',sans-serif;letter-spacing:.4px;text-transform:uppercase;
      transition:color .2s;position:relative;
    }
    .nav-btn.active{color:var(--text);}
    .nav-btn.active::after{
      content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
      width:20px;height:1px;background:var(--gold);
    }
    .nav-icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center;}
    .nav-icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}

    /* ── SECTION HEADER ── */
    .s-header{
      padding:calc(env(safe-area-inset-top,0px) + 28px) 0 20px;
    }
    .s-label{font-size:10px;font-weight:600;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;}
    .s-title{font-size:28px;font-weight:700;letter-spacing:-.5px;}

    /* ── HERO BALANCE ── */
    .hero{
      padding:calc(env(safe-area-inset-top,0px) + 32px) 20px 28px;
      max-width:480px;margin:0 auto;
    }
    .hero-label{font-size:10px;font-weight:600;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:10px;}
    .hero-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border2),transparent);}
    .hero-amount{
      font-size:52px;font-weight:700;letter-spacing:-2.5px;line-height:1;
      color:var(--text);margin-bottom:8px;
      font-variant-numeric:tabular-nums;
    }
    .hero-amount.neg{color:var(--red);}
    .hero-meta{display:flex;align-items:center;justify-content:space-between;margin-top:16px;}
    .hero-month{font-size:13px;color:var(--text2);font-weight:400;}
    .hero-nav{display:flex;gap:2px;}
    .hero-nav-btn{
      width:28px;height:28px;border-radius:6px;
      background:var(--s2);border:1px solid var(--border);
      color:var(--text2);font-size:15px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:all .15s;font-weight:300;
    }
    .hero-nav-btn:active{background:var(--s3);color:var(--text);}

    /* ── DIVIDER ── */
    .divider{height:1px;background:var(--border);margin:0 20px;}

    /* ── METRIC ROW ── */
    .metrics{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);margin-bottom:1px;}
    .metric{background:var(--bg);padding:18px 20px;}
    .metric-label{font-size:10px;font-weight:500;color:var(--text3);letter-spacing:.8px;text-transform:uppercase;margin-bottom:6px;}
    .metric-val{font-size:20px;font-weight:600;letter-spacing:-.5px;font-variant-numeric:tabular-nums;}
    .metric-val.pos{color:var(--green);}
    .metric-val.neg{color:var(--red);}
    .metric-sub{font-size:11px;color:var(--text3);margin-top:3px;font-variant-numeric:tabular-nums;}

    /* ── SECTION LABEL ── */
    .sec{
      padding:24px 20px 12px;
      font-size:10px;font-weight:600;color:var(--text3);
      letter-spacing:1.5px;text-transform:uppercase;
      display:flex;align-items:center;gap:12px;
    }
    .sec::after{content:'';flex:1;height:1px;background:var(--border);}

    /* ── CATEGORY ROW ── */
    .cat-row{
      display:flex;align-items:center;gap:14px;
      padding:13px 20px;border-bottom:1px solid var(--border);
      transition:background .1s;
    }
    .cat-row:last-child{border-bottom:none;}
    .cat-row:active{background:var(--s1);}
    .cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
    .cat-body{flex:1;min-width:0;}
    .cat-name{font-size:13px;font-weight:400;color:var(--text);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .cat-track{height:2px;background:var(--s3);border-radius:2px;overflow:hidden;}
    .cat-fill{height:100%;border-radius:2px;transition:width .5s cubic-bezier(.4,0,.2,1);}
    .cat-right{text-align:right;flex-shrink:0;min-width:80px;}
    .cat-real{font-size:13px;font-weight:500;letter-spacing:-.3px;font-variant-numeric:tabular-nums;}
    .cat-ppto{font-size:11px;color:var(--text3);margin-top:2px;font-variant-numeric:tabular-nums;}

    /* ── ALERT ── */
    .alert{margin:0 20px 0;border-radius:0;padding:12px 0;font-size:12px;line-height:1.5;color:var(--text2);border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start;}
    .alert-dot{width:6px;height:6px;border-radius:50%;margin-top:4px;flex-shrink:0;}
    .alert.ok .alert-dot{background:var(--green);}
    .alert.warn .alert-dot{background:#F59E0B;}
    .alert.danger .alert-dot{background:var(--red);}
    .alert strong{color:var(--text);font-weight:600;}

    /* ── EXPORT BTN ── */
    .export-row{padding:20px 20px 0;}
    .btn-export{
      width:100%;padding:14px;
      background:none;border:1px solid var(--border2);
      border-radius:10px;color:var(--text2);
      font-size:13px;font-weight:500;cursor:pointer;
      font-family:'Inter',sans-serif;letter-spacing:.3px;
      transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;
    }
    .btn-export:active{background:var(--s2);color:var(--text);}
    .btn-export svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}

    /* ── FORM ── */
    .form-wrap{padding:0 20px;}
    .fg{margin-bottom:20px;}
    .fg label{display:block;font-size:10px;font-weight:600;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
    .fi,.fs{
      width:100%;background:var(--s1);
      border:1px solid var(--border2);border-radius:8px;
      padding:12px 14px;color:var(--text);font-size:15px;
      outline:none;-webkit-appearance:none;appearance:none;
      font-family:'Inter',sans-serif;
      transition:border-color .15s;
    }
    .fi:focus,.fs:focus{border-color:rgba(200,169,110,0.4);}
    .fi::placeholder{color:var(--text3);}
    select option{background:#0D0D16;color:#EEEEF2;}

    .type-row{display:flex;gap:8px;}
    .type-btn{
      flex:1;padding:11px 8px;border-radius:8px;
      background:var(--s1);border:1px solid var(--border);
      color:var(--text2);font-size:12px;font-weight:600;
      cursor:pointer;font-family:'Inter',sans-serif;
      letter-spacing:.3px;text-transform:uppercase;
      transition:all .2s;text-align:center;
    }
    .type-btn.active-g{background:rgba(239,100,97,.12);border-color:rgba(239,100,97,.3);color:var(--red);}
    .type-btn.active-i{background:rgba(62,207,142,.1);border-color:rgba(62,207,142,.25);color:var(--green);}

    .btn-submit{
      width:100%;padding:14px;
      background:var(--gold);border:none;border-radius:8px;
      color:#08080E;font-size:14px;font-weight:700;
      cursor:pointer;font-family:'Inter',sans-serif;letter-spacing:.5px;text-transform:uppercase;
      transition:opacity .2s;margin-top:4px;
    }
    .btn-submit:active{opacity:.85;}

    /* ── INFORME MODAL ── */
    .inf-modal{
      position:fixed;inset:0;z-index:200;
      background:var(--bg);
      display:flex;flex-direction:column;
      transform:translateY(100%);transition:transform .35s cubic-bezier(.32,.72,0,1);
      padding-top:env(safe-area-inset-top);
    }
    .inf-modal.open{transform:translateY(0);}
    .inf-top{
      display:flex;align-items:flex-start;justify-content:space-between;
      padding:20px 20px 0;flex-shrink:0;
    }
    .inf-label{font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);margin-bottom:4px;}
    .inf-title{font-size:26px;font-weight:700;color:var(--text);letter-spacing:-.5px;}
    .inf-subtitle{font-size:12px;color:var(--text3);margin-top:3px;}
    .inf-close{
      width:34px;height:34px;border-radius:50%;
      background:var(--s3);border:1px solid var(--border);
      color:var(--text2);font-size:18px;line-height:1;
      cursor:pointer;display:flex;align-items:center;justify-content:center;
      flex-shrink:0;margin-top:2px;
    }
    .inf-body{overflow-y:auto;flex:1;padding:24px 20px 40px;-webkit-overflow-scrolling:touch;}
    .inf-sec{margin-bottom:28px;}
    .inf-sec-title{font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text3);margin-bottom:14px;}
    .stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
    .stat-card{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:12px 10px;}
    .stat-card .sc-lbl{font-size:9px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);margin-bottom:6px;}
    .stat-card .sc-val{font-size:15px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-.3px;}
    .stat-card .sc-val.pos{color:var(--green);}
    .stat-card .sc-val.neg{color:var(--red);}
    .stat-card .sc-sub{font-size:10px;color:var(--text3);margin-top:3px;}
    .bar-list{display:flex;flex-direction:column;gap:10px;}
    .bar-item{display:flex;flex-direction:column;gap:5px;}
    .bar-meta{display:flex;justify-content:space-between;align-items:baseline;}
    .bar-name{font-size:12px;color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%;}
    .bar-amount{font-size:12px;color:var(--text2);font-variant-numeric:tabular-nums;}
    .bar-track{height:4px;background:var(--s3);border-radius:2px;overflow:hidden;}
    .bar-fill{height:100%;border-radius:2px;transition:width .6s ease;}
    .concl-list{display:flex;flex-direction:column;gap:10px;}
    .concl-item{display:flex;gap:10px;align-items:flex-start;padding:12px;background:var(--s2);border-radius:10px;border:1px solid var(--border);}
    .concl-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:5px;}
    .concl-text{font-size:13px;color:var(--text2);line-height:1.5;}
    .concl-text strong{color:var(--text);font-weight:600;}
    .health-bar-wrap{margin-bottom:20px;}
    .health-label{display:flex;justify-content:space-between;margin-bottom:8px;}
    .health-score-txt{font-size:22px;font-weight:700;letter-spacing:-.5px;}
    .health-track{height:6px;background:var(--s3);border-radius:3px;overflow:hidden;}
    .health-fill{height:100%;border-radius:3px;}
    .over-list{display:flex;flex-direction:column;gap:8px;}
    .over-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:rgba(239,100,97,.07);border:1px solid rgba(239,100,97,.18);border-radius:8px;}
    .over-name{font-size:12px;color:var(--text);font-weight:500;}
    .over-pct{font-size:12px;font-weight:700;color:var(--red);}
    .divider{height:1px;background:var(--border);margin:0 0 28px;}

    /* ── MONTH CHIPS ── */
    .chips{display:flex;gap:6px;overflow-x:auto;padding:0 20px 16px;scrollbar-width:none;}
    .chips::-webkit-scrollbar{display:none;}
    .chip{
      padding:6px 14px;border-radius:20px;
      background:none;border:1px solid var(--border);
      color:var(--text3);font-size:11px;font-weight:500;
      cursor:pointer;white-space:nowrap;font-family:'Inter',sans-serif;
      letter-spacing:.3px;transition:all .15s;
    }
    .chip.active{border-color:var(--gold);color:var(--gold);}

    /* ── FILTER ── */
    .filter-row{display:flex;gap:6px;padding:0 20px 16px;}
    .f-btn{
      padding:5px 13px;border-radius:20px;
      border:1px solid var(--border);background:none;
      color:var(--text3);font-size:11px;font-weight:500;
      cursor:pointer;font-family:'Inter',sans-serif;letter-spacing:.3px;
      transition:all .15s;
    }
    .f-btn.active{border-color:var(--border2);color:var(--text);background:var(--s2);}

    /* ── TRANSACTION LIST ── */
    .tx{
      display:flex;align-items:center;gap:14px;
      padding:13px 20px;border-bottom:1px solid var(--border);
      transition:background .1s;
    }
    .tx:last-child{border-bottom:none;}
    .tx:active{background:var(--s1);}
    .tx-bar{width:3px;height:32px;border-radius:2px;flex-shrink:0;}
    .tx-info{flex:1;min-width:0;}
    .tx-desc{font-size:14px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .tx-cat{font-size:11px;color:var(--text3);margin-top:2px;}
    .tx-right{text-align:right;flex-shrink:0;}
    .tx-amt{font-size:14px;font-weight:500;letter-spacing:-.3px;font-variant-numeric:tabular-nums;}
    .tx-amt.neg{color:var(--red);}
    .tx-amt.pos{color:var(--green);}
    .tx-date{font-size:11px;color:var(--text3);margin-top:2px;}
    .tx-del{background:none;border:none;color:var(--text3);font-size:14px;cursor:pointer;padding:6px 4px;flex-shrink:0;transition:color .15s;}
    .tx-del:active{color:var(--red);}

    /* ── RESUMEN ── */
    .res-sec{padding:20px 20px 8px;font-size:10px;font-weight:600;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;}
    .res-row{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;border-bottom:1px solid var(--border);font-size:13px;}
    .res-row:last-child{border-bottom:none;}
    .res-name{color:var(--text2);flex:1;font-weight:400;}
    .res-ppto{color:var(--text3);text-align:right;min-width:80px;font-size:11px;font-variant-numeric:tabular-nums;}
    .res-real{font-weight:500;text-align:right;min-width:80px;font-variant-numeric:tabular-nums;}
    .res-total-row{
      display:flex;justify-content:space-between;align-items:center;
      padding:13px 20px;background:var(--s1);
      border-bottom:1px solid var(--border);
      font-size:13px;font-weight:600;
    }

    /* ── MONTH NAV (resumen) ── */
    .m-nav{display:flex;align-items:center;justify-content:space-between;padding:0 20px 20px;}
    .m-nav-btn{width:32px;height:32px;border-radius:6px;background:var(--s2);border:1px solid var(--border);color:var(--text2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
    .m-nav-btn:active{background:var(--s3);}
    .m-nav-title{font-size:18px;font-weight:600;letter-spacing:-.3px;}

    /* ── TOAST ── */
    .toast{
      position:fixed;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px);
      left:50%;transform:translateX(-50%) translateY(8px);
      background:var(--s3);border:1px solid var(--border2);
      color:var(--text);padding:10px 18px;border-radius:6px;
      font-size:12px;font-weight:500;letter-spacing:.3px;
      opacity:0;transition:all .25s;z-index:300;
      pointer-events:none;white-space:nowrap;font-family:'Inter',sans-serif;
      text-transform:uppercase;
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    .toast.err{border-color:rgba(239,100,97,.3);color:var(--red);}

    /* ── EMPTY ── */
    .empty{padding:60px 20px;text-align:center;color:var(--text3);font-size:13px;line-height:1.6;}

    /* ── DETALLE CATEGORÍA ── */
    .det-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
    .det-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
    .det-title{font-size:20px;font-weight:700;letter-spacing:-.3px;}
    .det-track{height:4px;background:var(--s3);border-radius:2px;overflow:hidden;margin-bottom:20px;}
    .det-fill{height:100%;border-radius:2px;}
    .det-nums{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border-radius:10px;overflow:hidden;margin-bottom:24px;}
    .det-num{background:var(--s2);padding:14px 16px;}
    .det-num-lbl{font-size:10px;color:var(--text3);font-weight:600;letter-spacing:.8px;text-transform:uppercase;margin-bottom:5px;}
    .det-num-val{font-size:18px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums;}
    .det-txs-title{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:12px;}
    .det-tx{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);}
    .det-tx:last-child{border-bottom:none;}
    .det-tx-desc{font-size:13px;color:var(--text);font-weight:400;}
    .det-tx-date{font-size:11px;color:var(--text3);margin-top:2px;}
    .det-tx-amt{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;}

    /* ── PENDING BADGE ── */
    .nav-badge{position:absolute;top:7px;right:calc(50% - 16px);background:var(--red);color:#fff;font-size:9px;font-weight:700;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;pointer-events:none;line-height:1;}
    .tx.tx-pending{background:rgba(245,158,11,.04);}
    .tx-tag-btn{background:none;border:1px solid rgba(245,158,11,.4);border-radius:4px;color:#F59E0B;font-size:10px;font-weight:600;cursor:pointer;padding:3px 7px;flex-shrink:0;font-family:'Inter',sans-serif;letter-spacing:.3px;text-transform:uppercase;transition:all .15s;}
    .tx-tag-btn:active{background:rgba(245,158,11,.1);}

    /* ── BANCO IMPORT ── */
    .banco-item{background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;}
    .banco-item-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;gap:12px;}
    .banco-item-desc{font-size:14px;font-weight:500;color:var(--text);margin-bottom:3px;}
    .banco-item-fecha{font-size:11px;color:var(--text3);}
    .banco-item-monto{font-size:18px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums;flex-shrink:0;}
    .banco-item-row{margin-bottom:10px;}
    .banco-item-row:last-child{margin-bottom:0;}
    .banco-btn-row{display:flex;gap:8px;}
    .banco-btn-skip{flex:1;padding:10px;border-radius:8px;background:none;border:1px solid var(--border);color:var(--text3);font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;letter-spacing:.3px;text-transform:uppercase;transition:all .15s;}
    .banco-btn-skip:active{background:var(--s3);color:var(--text);}
    .banco-btn-add{flex:2;padding:10px;border-radius:8px;background:var(--gold);border:none;color:#08080E;font-size:12px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;letter-spacing:.5px;text-transform:uppercase;transition:opacity .15s;}
    .banco-btn-add:active{opacity:.8;}

  {id:'g015',fecha:'2026-05-10',desc:'Uber',monto:5768,cat:'Movilización (peaje/uber)',tipo:'gasto',mes:0},
  {id:'g016',fecha:'2026-05-14',desc:'Uber',monto:3300,cat:'Movilización (peaje/uber)',tipo:'gasto',mes:0},
  {id:'g017',fecha:'2026-05-03',desc:'Carga bencina',monto:46000,cat:'Bencina',tipo:'gasto',mes:0},
  {id:'g018',fecha:'2026-05-10',desc:'Bencina',monto:42598,cat:'Bencina',tipo:'gasto',mes:0},

  {id:'g020',fecha:'2026-05-01',desc:'Corte de pelo',monto:11000,cat:'Corte de pelo',tipo:'gasto',mes:0}

// ══════════════════════════════════════
//  ESTADO
// ══════════════════════════════════════
let currentTipo='gasto',mesIni=0,mesRes=0,mesHist=0,filtroHist='todo';

function loadData(){const r=localStorage.getItem('flujoNico2026');if(!r){saveData(TX_INICIALES);return TX_INICIALES;}return JSON.parse(r);}
function saveData(t){localStorage.setItem('flujoNico2026',JSON.stringify(t));}
function getAll(){return loadData();}
function addTx(t){const a=getAll();a.push(t);saveData(a);}
function deleteTx(id){saveData(getAll().filter(t=>t.id!==id));}
function clp(n){if(n===null||n===undefined)return'—';const s='$ '+Math.abs(n).toLocaleString('es-CL');return n<0?'-'+s:s;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function sumCat(txs,cat,mes,tipo){return txs.filter(t=>t.cat===cat&&t.mes===mes&&t.tipo===tipo).reduce((s,t)=>s+t.monto,0);}
function sumGrupo(txs,g,mes,tipo){return Object.keys(g).reduce((s,c)=>s+sumCat(txs,c,mes,tipo),0);}
function detectarMes(d){if(d.getFullYear()===2026&&d.getMonth()>=4&&d.getMonth()<=11)return d.getMonth()-4;return 0;}
function showToast(msg,err=false){const t=document.getElementById('toast');t.textContent=msg;t.className='toast'+(err?' err':'');void t.offsetWidth;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function formatFecha(s){if(!s)return'';const[y,m,d]=s.split('-');const mn=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];return`${parseInt(d)} ${mn[parseInt(m)-1]}`;}

function fillColor(p){if(p<70)return'#3ECF8E';if(p<95)return'#C8A96E';if(p<110)return'#F97316';return'#EF6461';}

// ══════════════════════════════════════
//  NAVEGACIÓN
// ══════════════════════════════════════
function showScreen(n){
  ['inicio','agregar','historial','resumen'].forEach(x=>{
    document.getElementById('s-'+x).classList.toggle('active',x===n);
    document.getElementById('nb-'+x).classList.toggle('active',x===n);
  });
  if(n==='inicio')renderInicio();
  if(n==='agregar')initAgregar();
  if(n==='historial')renderHistorial();
  if(n==='resumen')renderResumen();
}

// ══════════════════════════════════════
//  INICIO
// ══════════════════════════════════════
function cambiarMesIni(d){mesIni=Math.max(0,Math.min(7,mesIni+d));renderInicio();}

function renderInicio(){
  const txs=getAll();const m=mesIni;
  let sI=SALDO_INI_MAY;
  for(let i=0;i<m;i++)sI+=sumGrupo(txs,PPTO.ingresos,i,'ingreso')-sumGrupo(txs,PPTO.fijos,i,'gasto')-sumGrupo(txs,PPTO.variables,i,'gasto');
  const ingR=sumGrupo(txs,PPTO.ingresos,m,'ingreso');
  const gasR=sumGrupo(txs,PPTO.fijos,m,'gasto')+sumGrupo(txs,PPTO.variables,m,'gasto');
  const ingP=Object.values(PPTO.ingresos).reduce((s,a)=>s+a[m],0);
  const gasP=Object.values(PPTO.fijos).reduce((s,a)=>s+a[m],0)+Object.values(PPTO.variables).reduce((s,a)=>s+a[m],0);
  const neto=ingR-gasR;const sF=sI+neto;

  const $s=document.getElementById('ini-saldo');
  $s.textContent=clp(sF);$s.className='hero-amount'+(sF<0?' neg':'');
  document.getElementById('ini-month').textContent=MONTHS_FULL[m]+(m===0?' · en curso':'');

  document.getElementById('ini-ing').textContent=clp(ingR);
  document.getElementById('ini-ing-sub').textContent='Ppto '+clp(ingP);
  document.getElementById('ini-gas').textContent=clp(gasR);
  document.getElementById('ini-gas-sub').textContent='Ppto '+clp(gasP);
  const $n=document.getElementById('ini-neto');$n.textContent=clp(neto);
  $n.className='metric-val'+(neto>=0?' pos':' neg');

  const pctG=gasP?Math.round((gasR/gasP)*100):0;
  const $al=document.getElementById('ini-alert-wrap');
  if(pctG>100)$al.innerHTML=`<div class="alert danger"><div class="alert-dot"></div><div>Llevas el <strong>${pctG}%</strong> del presupuesto de gastos en ${MONTHS[m]}.</div></div>`;
  else if(pctG>80)$al.innerHTML=`<div class="alert warn"><div class="alert-dot"></div><div>Llevas el <strong>${pctG}%</strong> del presupuesto. Queda poco margen.</div></div>`;
  else if(neto>0)$al.innerHTML=`<div class="alert ok"><div class="alert-dot"></div><div>Flujo positivo de <strong>${clp(neto)}</strong> en ${MONTHS[m]}.</div></div>`;
  else $al.innerHTML='';

  document.getElementById('ini-ing-rows').innerHTML=makeRows(txs,PPTO.ingresos,m,'ingreso');
  document.getElementById('ini-var-rows').innerHTML=makeRows(txs,PPTO.variables,m,'gasto');
  document.getElementById('ini-fij-rows').innerHTML=makeRows(txs,PPTO.fijos,m,'gasto');
}

function makeRows(txs,grupo,m,tipo){
  let html='';
  for(const[cat,arr]of Object.entries(grupo)){
    const real=sumCat(txs,cat,m,tipo);const ppto=arr[m];
    if(ppto===0&&real===0)continue;
    const p=ppto?Math.min(Math.round((real/ppto)*100),100):real>0?100:0;
    const col=CAT_COLOR[cat]||'#6B7280';
    const barCol=tipo==='ingreso'?col:fillColor(p);
    html+=`<div class="cat-row" onclick="abrirDetalleCat('${cat.replace(/'/g,"\\'")}','${tipo}',${m})" style="cursor:pointer;">
      <div class="cat-dot" style="background:${col};"></div>
      <div class="cat-body">
        <div class="cat-name">${cat}</div>
        <div class="cat-track"><div class="cat-fill" style="width:${p}%;background:${barCol};"></div></div>
      </div>
      <div class="cat-right">
        <div class="cat-real">${clp(real)}</div>
        <div class="cat-ppto">${clp(ppto)}</div>
      </div>
    </div>`;
  }
  return html||'<div style="padding:12px 20px;font-size:12px;color:var(--text3);">Sin movimientos este mes</div>';
}

function initAgregar(){
  const h=new Date();
  document.getElementById('f-fecha').value=`${h.getFullYear()}-${String(h.getMonth()+1).padStart(2,'0')}-${String(h.getDate()).padStart(2,'0')}`;
  document.getElementById('f-mes').value=detectarMes(h);
  setTipo(currentTipo);updateCats();
}
function setTipo(t){
  currentTipo=t;
  document.getElementById('btn-gasto').className='type-btn'+(t==='gasto'?' active-g':'');
  document.getElementById('btn-ingreso').className='type-btn'+(t==='ingreso'?' active-i':'');
  updateCats();
}
function updateCats(){
  const s=document.getElementById('f-cat');s.innerHTML='';
  const gs=currentTipo==='gasto'
    ?[{l:'Variables',c:Object.keys(PPTO.variables)},{l:'Fijos',c:Object.keys(PPTO.fijos)}]
    :[{l:'Ingresos',c:Object.keys(PPTO.ingresos)}];
  for(const g of gs){const o=document.createElement('optgroup');o.label=g.l;for(const c of g.c){const op=document.createElement('option');op.value=c;op.textContent=c;o.appendChild(op);}s.appendChild(o);}
}
function fmtMonto(el){
  const raw=el.value.replace(/\D/g,'');
  if(!raw){el.value='';return;}
  el.value=parseInt(raw,10).toLocaleString('es-CL');
}
function guardarTransaccion(){
  const fecha=document.getElementById('f-fecha').value;
  const mes=parseInt(document.getElementById('f-mes').value);
  const cat=document.getElementById('f-cat').value;
  const desc=document.getElementById('f-desc').value.trim();
  const monto=parseInt(document.getElementById('f-monto').value.replace(/\D/g,''),10);
  if(!fecha){showToast('Falta la fecha',true);return;}
  if(!desc){showToast('Falta la descripción',true);return;}
  if(!monto||monto<=0){showToast('Monto inválido',true);return;}
  addTx({id:uid(),fecha,desc,monto,cat,tipo:currentTipo,mes});
  showToast(currentTipo==='gasto'?'Gasto guardado':'Ingreso guardado');
  document.getElementById('f-desc').value='';document.getElementById('f-monto').value='';
}

function renderHistorial(){
  document.getElementById('hist-chips').innerHTML=MONTHS.map((mn,i)=>`<div class="chip${i===mesHist?' active':''}" onclick="setMesHist(${i})">${mn}</div>`).join('');
  const txs=getAll().filter(t=>t.mes===mesHist).filter(t=>filtroHist==='todo'||t.tipo===filtroHist).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const $l=document.getElementById('hist-lista');
  if(!txs.length){$l.innerHTML='<div class="empty">Sin movimientos en este mes</div>';return;}
  $l.innerHTML=txs.map(t=>{
    const pend=t.pendiente===true;
    const col=pend?'#F59E0B':(CAT_COLOR[t.cat]||'#6B7280');
    const catLabel=pend?`<span style="color:#F59E0B;font-weight:500;">Sin categorizar</span>`:t.cat;
    const actionBtn=pend
      ?`<button class="tx-tag-btn" onclick="abrirCategorizador('${t.id}')">Categorizar</button>`
      :`<button class="tx-del" onclick="confirmarBorrar('${t.id}','${t.desc.replace(/'/g,"\\'")}')">&#10005;</button>`;
    return`<div class="tx${pend?' tx-pending':''}">
    <div class="tx-bar" style="background:${col};"></div>
    <div class="tx-info"><div class="tx-desc">${t.desc}</div><div class="tx-cat">${catLabel}</div></div>
    <div class="tx-right">
      <div class="tx-amt ${t.tipo==='gasto'?'neg':'pos'}">${t.tipo==='gasto'?'−':'+'}${clp(t.monto)}</div>
      <div class="tx-date">${formatFecha(t.fecha)}</div>
    </div>
    ${actionBtn}
  </div>`;
  }).join('');
}
function setMesHist(i){mesHist=i;renderHistorial();}
function setFiltro(f){filtroHist=f;['todo','gasto','ingreso'].forEach(x=>document.getElementById('fb-'+x).classList.toggle('active',x===f));renderHistorial();}
function confirmarBorrar(id,desc){if(confirm(`¿Eliminar "${desc}"?`)){deleteTx(id);renderHistorial();showToast('Eliminado');}}

function cambiarMesRes(d){mesRes=Math.max(0,Math.min(7,mesRes+d));renderResumen();}
function renderResumen(){
  document.getElementById('res-mes-nombre').textContent=MONTHS_FULL[mesRes];
  const txs=getAll();const m=mesRes;
  const ingR=sumGrupo(txs,PPTO.ingresos,m,'ingreso');
  const fijR=sumGrupo(txs,PPTO.fijos,m,'gasto');
  const varR=sumGrupo(txs,PPTO.variables,m,'gasto');
  const ingP=Object.values(PPTO.ingresos).reduce((s,a)=>s+a[m],0);
  const fijP=Object.values(PPTO.fijos).reduce((s,a)=>s+a[m],0);
  const varP=Object.values(PPTO.variables).reduce((s,a)=>s+a[m],0);
  const gasR=fijR+varR;const gasP=fijP+varP;
  const netoR=ingR-gasR;const netoP=ingP-gasP;

  const $al=document.getElementById('res-alert-wrap');
  if(netoR<0)$al.innerHTML=`<div class="alert danger" style="margin-bottom:8px;"><div class="alert-dot"></div><div>Flujo negativo de <strong>${clp(netoR)}</strong></div></div>`;
  else if(netoR>=netoP)$al.innerHTML=`<div class="alert ok" style="margin-bottom:8px;"><div class="alert-dot"></div><div>Flujo mejor que el presupuestado</div></div>`;
  else $al.innerHTML='';

  function fila(n,r,p,isTotal=false,isSec=false){
    if(isSec)return`<div class="res-sec">${n}</div>`;
    if(isTotal){const c=r>=p?'var(--green)':'var(--red)';return`<div class="res-total-row"><span>${n}</span><span style="color:var(--text3);font-size:11px;font-weight:400;">${clp(p)}</span><span style="color:${c};">${clp(r)}</span></div>`;}
    return`<div class="res-row"><span class="res-name">${n}</span><span class="res-ppto">${clp(p)}</span><span class="res-real">${clp(r)}</span></div>`;
  }

  let html='<div style="display:flex;justify-content:flex-end;padding:0 20px 4px;font-size:10px;color:var(--text3);font-weight:500;letter-spacing:.5px;text-transform:uppercase;"><span style="min-width:80px;text-align:right;">Ppto</span><span style="min-width:80px;text-align:right;">Real</span></div>';
  html+=fila('Ingresos','','',false,true);
  for(const[c,a]of Object.entries(PPTO.ingresos))html+=fila(c,sumCat(txs,c,m,'ingreso'),a[m]);
  html+=fila('Total ingresos',ingR,ingP,true);
  html+=fila('Gastos fijos','','',false,true);
  for(const[c,a]of Object.entries(PPTO.fijos))html+=fila(c,sumCat(txs,c,m,'gasto'),a[m]);
  html+=fila('Subtotal fijos',fijR,fijP,true);
  html+=fila('Gastos variables','','',false,true);
  for(const[c,a]of Object.entries(PPTO.variables))html+=fila(c,sumCat(txs,c,m,'gasto'),a[m]);
  html+=fila('Subtotal variables',varR,varP,true);
  html+=fila('Flujo neto del mes',netoR,netoP,true);
  document.getElementById('res-tabla').innerHTML=html;
}

// ══════════════════════════════════════
function csvRow(arr){
  return arr.map(v=>{
    const s=v===undefined||v===null?'':String(v);
    return s.includes(',')||s.includes('"')||s.includes('\n')?'"'+s.replace(/"/g,'""')+'"':s;
  }).join(',')+'\r\n';
}
function exportarExcel(){
  const txs=getAll();
  // Hoja 1: Flujo presupuesto vs real
  let csv='﻿'; // BOM para que Excel reconozca UTF-8
  csv+=csvRow(['FLUJO DE CAJA MAY–DIC 2026 – NICO MUÑOZ']);
  csv+=csvRow(['Generado: '+new Date().toLocaleDateString('es-CL')]);
  csv+=csvRow([]);
  const cab=['CONCEPTO'];for(const mn of MONTHS){cab.push(mn+' Ppto',mn+' Real');}cab.push('Total Ppto','Total Real');
  csv+=csvRow(cab);
  csv+=csvRow(['Saldo inicial','',SALDO_INI_MAY]);
  csv+=csvRow([]);
  for(const[sec,tipo,grupo]of[['INGRESOS','ingreso',PPTO.ingresos],['GASTOS FIJOS','gasto',PPTO.fijos],['GASTOS VARIABLES','gasto',PPTO.variables]]){
    csv+=csvRow([sec]);
    for(const[c,a]of Object.entries(grupo)){
      const r=[c];let tp=0,tr=0;
      for(let i=0;i<8;i++){const p=a[i],rl=sumCat(txs,c,i,tipo);r.push(p,rl);tp+=p;tr+=rl;}
      r.push(tp,tr);csv+=csvRow(r);
    }
    const r=['Total '+sec.toLowerCase()];let tp=0,tr=0;
    for(let i=0;i<8;i++){const p=Object.values(grupo).reduce((s,a)=>s+a[i],0),rl=sumGrupo(txs,grupo,i,tipo);r.push(p,rl);tp+=p;tr+=rl;}
    r.push(tp,tr);csv+=csvRow(r);csv+=csvRow([]);
  }
  {const r=['Flujo neto'];let tp=0,tr=0;
    for(let i=0;i<8;i++){
      const ingP=Object.values(PPTO.ingresos).reduce((s,a)=>s+a[i],0);
      const gasP=Object.values(PPTO.fijos).reduce((s,a)=>s+a[i],0)+Object.values(PPTO.variables).reduce((s,a)=>s+a[i],0);
      const ingR=sumGrupo(txs,PPTO.ingresos,i,'ingreso');
      const gasR=sumGrupo(txs,PPTO.fijos,i,'gasto')+sumGrupo(txs,PPTO.variables,i,'gasto');
      r.push(ingP-gasP,ingR-gasR);tp+=(ingP-gasP);tr+=(ingR-gasR);
    }
    r.push(tp,tr);csv+=csvRow(r);
  }
  csv+=csvRow([]);
  csv+=csvRow(['--- DETALLE DE MOVIMIENTOS ---']);
  csv+=csvRow(['Fecha','Descripción','Monto','Categoría','Tipo','Mes']);
  for(const t of[...txs].sort((a,b)=>a.mes-b.mes||a.fecha.localeCompare(b.fecha)))
    csv+=csvRow([t.fecha,t.desc,t.monto,t.cat,t.tipo==='gasto'?'Gasto':'Ingreso',MONTHS_FULL[t.mes]||t.mes]);
  try{
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='Flujo_Nico_2026.csv';
    document.body.appendChild(a);a.click();
    setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},1000);
    showToast('Archivo descargado');
  }catch(e){showToast('Error al exportar',true);}
}

// ══════════════════════════════════════
//  INFORME DEL MES
// ══════════════════════════════════════
function generarInforme(){
  const mes=mesRes;
  const txs=getAll();
  const mn=MONTHS_FULL[mes];

  // ── Cálculos base ──
  const ingR=sumGrupo(txs,PPTO.ingresos,mes,'ingreso');
  const ingP=Object.values(PPTO.ingresos).reduce((s,a)=>s+a[mes],0);
  const gasP=Object.values(PPTO.fijos).reduce((s,a)=>s+a[mes],0)
            +Object.values(PPTO.variables).reduce((s,a)=>s+a[mes],0);
  const gasR=sumGrupo(txs,PPTO.fijos,mes,'gasto')
            +sumGrupo(txs,PPTO.variables,mes,'gasto');
  const netR=ingR-gasR;
  const netP=ingP-gasP;

  // ── Top gastos por categoría ──
  const allGas={...PPTO.fijos,...PPTO.variables};
  const catGas=Object.keys(allGas).map(c=>({
    cat:c, real:sumCat(txs,c,mes,'gasto'), ppto:allGas[c][mes]
  })).filter(x=>x.real>0).sort((a,b)=>b.real-a.real);
  const top5=catGas.slice(0,5);
  const maxTop=top5[0]?top5[0].real:1;

  // ── Categorías sobre presupuesto ──
  const sobre=catGas.filter(x=>x.ppto>0&&x.real>x.ppto).map(x=>({
    cat:x.cat, real:x.real, ppto:x.ppto, pct:Math.round(x.real/x.ppto*100)
  })).sort((a,b)=>b.pct-a.pct);

  // ── Health score (ejecución gasto vs presupuesto) ──
  const execPct=gasP>0?Math.round(gasR/gasP*100):0;
  let healthLbl,healthColor,healthScore;
  if(execPct<=75){healthLbl='Excelente';healthColor='#3ECF8E';healthScore=100;}
  else if(execPct<=90){healthLbl='Muy bueno';healthColor='#6EE7B7';healthScore=85;}
  else if(execPct<=100){healthLbl='Bueno';healthColor='#C8A96E';healthScore=70;}
  else if(execPct<=115){healthLbl='Atención';healthColor='#F97316';healthScore=45;}
  else{healthLbl='Crítico';healthColor='#EF4444';healthScore=20;}

  // ── Tasa de ahorro ──
  const tasaAhorro=ingR>0?Math.round((ingR-gasR)/ingR*100):0;

  // ── Conclusiones automáticas ──
  const conclusiones=[];
  if(ingR===0&&gasR===0){
    conclusiones.push({color:'#7B7E96',text:'No hay movimientos registrados en este mes todavía.'});
  } else {
    if(netR>=0){
      conclusiones.push({color:'#3ECF8E',text:`Mes positivo: el flujo neto fue <strong>${clp(netR)}</strong>, lo que significa que tus ingresos cubrieron todos los gastos.`});
    } else {
      conclusiones.push({color:'#EF4444',text:`Mes negativo: los gastos superaron los ingresos por <strong>${clp(Math.abs(netR))}</strong>. Revisar las categorías con mayor exceso.`});
    }
    if(tasaAhorro>=20){
      conclusiones.push({color:'#3ECF8E',text:`Tu tasa de ahorro fue del <strong>${tasaAhorro}%</strong>. Muy por encima del objetivo mínimo recomendado (10–15%).`});
    } else if(tasaAhorro>=10){
      conclusiones.push({color:'#C8A96E',text:`Tu tasa de ahorro fue del <strong>${tasaAhorro}%</strong>. En línea con el objetivo mínimo recomendado.`});
    } else if(tasaAhorro>=0){
      conclusiones.push({color:'#F97316',text:`Tu tasa de ahorro fue del <strong>${tasaAhorro}%</strong>. Bajo el mínimo recomendado del 10%. Revisar gastos variables.`});
    } else {
      conclusiones.push({color:'#EF4444',text:`Tasa de ahorro negativa: gastaste más de lo que ingresaste este mes.`});
    }
    if(top5.length>0){
      conclusiones.push({color:CAT_COLOR[top5[0].cat]||'#6B7280',text:`El mayor gasto del mes fue <strong>${top5[0].cat}</strong> con <strong>${clp(top5[0].real)}</strong>${top5[0].ppto>0?' (presupuesto: '+clp(top5[0].ppto)+')':''}.`});
    }
    if(sobre.length===0&&gasR>0){
      conclusiones.push({color:'#3ECF8E',text:`Todas las categorías se mantuvieron dentro del presupuesto. Excelente control del gasto.`});
    } else if(sobre.length>0){
      conclusiones.push({color:'#F97316',text:`<strong>${sobre.length} ${sobre.length===1?'categoría':'categorías'}</strong> superaron el presupuesto: ${sobre.slice(0,3).map(x=>x.cat).join(', ')}${sobre.length>3?'...':''}.`});
    }
    if(ingR<ingP&&ingP>0){
      const falta=ingP-ingR;
      conclusiones.push({color:'#F97316',text:`Los ingresos reales (<strong>${clp(ingR)}</strong>) estuvieron <strong>${clp(falta)}</strong> por debajo del presupuesto de ingresos.`});
    } else if(ingR>=ingP&&ingP>0){
      conclusiones.push({color:'#3ECF8E',text:`Los ingresos alcanzaron o superaron el presupuesto (<strong>${clp(ingR)}</strong> vs <strong>${clp(ingP)}</strong> proyectado).`});
    }
  }

  // ── Render HTML ──
  document.getElementById('inf-mes-title').textContent=mn;
  document.getElementById('inf-gen-date').textContent='Generado el '+new Date().toLocaleDateString('es-CL',{day:'numeric',month:'long',year:'numeric'});

  let html='';

  // Resumen financiero
  html+=`<div class="inf-sec">
    <div class="inf-sec-title">Resumen financiero</div>
    <div class="stat3">
      <div class="stat-card">
        <div class="sc-lbl">Ingresos</div>
        <div class="sc-val pos">${clp(ingR)}</div>
        <div class="sc-sub">Ppto ${clp(ingP)}</div>
      </div>
      <div class="stat-card">
        <div class="sc-lbl">Gastos</div>
        <div class="sc-val ${gasR>gasP?'neg':''}">${clp(gasR)}</div>
        <div class="sc-sub">Ppto ${clp(gasP)}</div>
      </div>
      <div class="stat-card">
        <div class="sc-lbl">Flujo neto</div>
        <div class="sc-val ${netR>=0?'pos':'neg'}">${clp(netR)}</div>
        <div class="sc-sub">Ppto ${clp(netP)}</div>
      </div>
    </div>
  </div>`;

  // Salud financiera
  html+=`<div class="inf-sec">
    <div class="inf-sec-title">Salud financiera del mes</div>
    <div class="health-bar-wrap">
      <div class="health-label">
        <span class="health-score-txt" style="color:${healthColor}">${healthLbl}</span>
        <span style="font-size:13px;color:var(--text3);">Ejecución gasto: ${execPct}%</span>
      </div>
      <div class="health-track">
        <div class="health-fill" style="width:${healthScore}%;background:${healthColor};"></div>
      </div>
    </div>
  </div>`;

  // Top gastos
  if(top5.length>0){
    html+=`<div class="inf-sec">
      <div class="inf-sec-title">Principales gastos</div>
      <div class="bar-list">`;
    for(const x of top5){
      const w=Math.round(x.real/maxTop*100);
      const col=CAT_COLOR[x.cat]||'#6B7280';
      const pctLabel=x.ppto>0?` · ${Math.round(x.real/x.ppto*100)}% del ppto`:'';
      html+=`<div class="bar-item">
        <div class="bar-meta">
          <span class="bar-name">${x.cat}</span>
          <span class="bar-amount">${clp(x.real)}${pctLabel}</span>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${col};"></div></div>
      </div>`;
    }
    html+=`</div></div>`;
  }

  // Categorías sobre presupuesto
  if(sobre.length>0){
    html+=`<div class="inf-sec">
      <div class="inf-sec-title">Categorías sobre presupuesto</div>
      <div class="over-list">`;
    for(const x of sobre){
      html+=`<div class="over-item">
        <span class="over-name">${x.cat}</span>
        <span class="over-pct">${x.pct}% <span style="font-weight:400;color:var(--text3);font-size:11px;">(+${clp(x.real-x.ppto)})</span></span>
      </div>`;
    }
    html+=`</div></div>`;
  }

  // Conclusiones
  if(conclusiones.length>0){
    html+=`<div class="inf-sec">
      <div class="inf-sec-title">Conclusiones</div>
      <div class="concl-list">`;
    for(const c of conclusiones){
      html+=`<div class="concl-item">
        <div class="concl-dot" style="background:${c.color};"></div>
        <div class="concl-text">${c.text}</div>
      </div>`;
    }
    html+=`</div></div>`;
  }

  document.getElementById('inf-body').innerHTML=html;
  document.getElementById('modal-informe').classList.add('open');
}

function cerrarInforme(){
  document.getElementById('modal-informe').classList.remove('open');
}

function abrirDetalleCat(cat,tipo,mes){
  const txs=getAll().filter(t=>t.cat===cat&&t.mes===mes&&t.tipo===tipo).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const real=txs.reduce((s,t)=>s+t.monto,0);
  const grupo=tipo==='ingreso'?PPTO.ingresos:{...PPTO.fijos,...PPTO.variables};
  const ppto=(grupo[cat]||[])[mes]||0;
  const col=CAT_COLOR[cat]||'#6B7280';
  const p=ppto?Math.min(Math.round(real/ppto*100),100):real>0?100:0;
  const barCol=tipo==='ingreso'?col:fillColor(p);
  const pctLabel=ppto?` · ${Math.round(real/ppto*100)}%`:'';

  document.getElementById('catdet-label').textContent=tipo==='ingreso'?'Ingreso':'Gasto';
  document.getElementById('catdet-title').textContent=cat;
  document.getElementById('catdet-mes').textContent=MONTHS_FULL[mes];

  let html=`
    <div class="det-track"><div class="det-fill" style="width:${p}%;background:${barCol};"></div></div>
    <div class="det-nums">
      <div class="det-num">
        <div class="det-num-lbl">Real</div>
        <div class="det-num-val" style="color:${tipo==='ingreso'?'var(--green)':'var(--text)'}">${clp(real)}${pctLabel}</div>
      </div>
      <div class="det-num">
        <div class="det-num-lbl">Presupuesto</div>
        <div class="det-num-val">${ppto?clp(ppto):'—'}</div>
      </div>
    </div>`;

  if(txs.length){
    html+=`<div class="det-txs-title">${txs.length} movimiento${txs.length>1?'s':''}</div>`;
    for(const t of txs){
      const sign=tipo==='gasto'?'−':'+';
      const color=tipo==='gasto'?'var(--red)':'var(--green)';
      html+=`<div class="det-tx">
        <div><div class="det-tx-desc">${t.desc}</div><div class="det-tx-date">${formatFecha(t.fecha)}</div></div>
        <div class="det-tx-amt" style="color:${color}">${sign}${clp(t.monto)}</div>
      </div>`;
    }
  } else {
    html+=`<div class="empty" style="padding:40px 0;">Sin movimientos registrados</div>`;
  }

  document.getElementById('catdet-body').innerHTML=html;
  document.getElementById('modal-catdet').classList.add('open');
}
function cerrarDetalleCat(){
  document.getElementById('modal-catdet').classList.remove('open');
}

// ══════════════════════════════════════
//  BADGE PENDIENTES
// ══════════════════════════════════════
function updateBadge(){
  const count=getAll().filter(t=>t.pendiente===true).length;
  let badge=document.getElementById('hist-badge');
  if(!badge){
    const btn=document.getElementById('nb-historial');
    badge=document.createElement('span');
    badge.id='hist-badge';badge.className='nav-badge';
    btn.appendChild(badge);
  }
  badge.textContent=count>9?'9+':count;
  badge.style.display=count>0?'flex':'none';
}

// ══════════════════════════════════════
//  CATEGORIZAR PENDIENTES
// ══════════════════════════════════════
let _catId=null;
function normFecha(f){
  if(!f)return'';
  if(/^\d{4}-\d{2}-\d{2}$/.test(f))return f;
  const d=new Date(f);
  if(!isNaN(d))return d.toISOString().split('T')[0];
  return'';
}
function abrirCategorizador(id){
  const tx=getAll().find(t=>t.id===id);
  if(!tx)return;
  _catId=id;
  const color=tx.tipo==='gasto'?'var(--red)':'var(--green)';
  const sign=tx.tipo==='gasto'?'−':'+';
  document.getElementById('catpick-meta').innerHTML=`<span style="color:${color};font-weight:600;">${sign}${clp(tx.monto)}</span>`;
  document.getElementById('catpick-fecha').value=normFecha(tx.fecha);
  document.getElementById('catpick-desc').value=tx.desc;
  const sel=document.getElementById('catpick-sel');
  const gastoOpts=[...Object.keys(PPTO.variables),...Object.keys(PPTO.fijos)].map(c=>`<option value="${c}">${c}</option>`).join('');
  const ingresoOpts=Object.keys(PPTO.ingresos).map(c=>`<option value="${c}">${c}</option>`).join('');
  sel.innerHTML=tx.tipo==='gasto'?gastoOpts:ingresoOpts;
  document.getElementById('modal-catpick').classList.add('open');
}
function cerrarCategorizador(){
  document.getElementById('modal-catpick').classList.remove('open');
  _catId=null;
}
function guardarCategorizacion(){
  if(!_catId)return;
  const cat=document.getElementById('catpick-sel').value;
  const desc=document.getElementById('catpick-desc').value.trim();
  const fecha=document.getElementById('catpick-fecha').value;
  const txs=getAll();
  const i=txs.findIndex(t=>t.id===_catId);
  if(i>=0){
    txs[i].cat=cat;txs[i].pendiente=false;
    if(desc)txs[i].desc=desc;
    if(fecha){txs[i].fecha=fecha;txs[i].mes=detectarMesFromFecha(fecha);}
    saveData(txs);
  }
  cerrarCategorizador();
  renderHistorial();updateBadge();
  showToast('Categoría guardada');
}
function eliminarPending(){
  if(!_catId)return;
  const tx=getAll().find(t=>t.id===_catId);
  if(!tx)return;
  if(confirm(`¿Eliminar "${tx.desc}"?`)){
    deleteTx(_catId);cerrarCategorizador();
    renderHistorial();updateBadge();
    showToast('Eliminado');
  }
}

// ══════════════════════════════════════
//  IMPORTAR DEL BANCO (Gmail Apps Script)
// ══════════════════════════════════════
function detectarMesFromFecha(fecha){
  const p=fecha.split('-');
  return detectarMes(new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2])));
}
function _importItems(items){
  if(!items.length)return 0;
  const url=localStorage.getItem('bancoScriptUrl')||'';
  const txs=getAll();
  const existingIds=new Set(txs.filter(t=>t.bancoId).map(t=>t.bancoId));
  let count=0;
  for(const tx of items){
    if(existingIds.has(tx.id))continue;
    const mes=detectarMesFromFecha(tx.fecha);
    addTx({id:uid(),fecha:tx.fecha,desc:tx.desc,monto:tx.monto,cat:'Sin categorizar',tipo:tx.tipo,mes,pendiente:true,bancoId:tx.id});
    if(url)fetch(url+'?action=confirm&id='+encodeURIComponent(tx.id)).catch(()=>{});
    count++;
  }
  return count;
}
function sincronizarRefresh(){
  const btn=document.getElementById('btn-refresh');
  const url=localStorage.getItem('bancoScriptUrl');
  if(!url){showToast('Configura el script en "Importar del banco"',true);return;}
  if(btn)btn.classList.add('spinning');
  fetch(url)
    .then(r=>r.json())
    .then(items=>{
      const count=_importItems(items);
      updateBadge();renderInicio();
      setTimeout(()=>{if(btn)btn.classList.remove('spinning');},400);
      showToast(count>0?(count===1?'1 movimiento importado':`${count} movimientos importados`):'Sin movimientos nuevos');
    })
    .catch(()=>{if(btn)btn.classList.remove('spinning');showToast('No se pudo conectar',true);});
}
function autoImportarBanco(){
  const url=localStorage.getItem('bancoScriptUrl');
  if(!url)return;
  fetch(url)
    .then(r=>r.json())
    .then(items=>{
      const count=_importItems(items);
      if(count>0){
        updateBadge();renderInicio();
        showToast(count===1?'1 movimiento del banco importado':`${count} movimientos del banco importados`);
      }
    })
    .catch(()=>{});
}
function abrirBanco(){
  document.getElementById('modal-banco').classList.add('open');
  renderBanco();
}
function cerrarBanco(){
  document.getElementById('modal-banco').classList.remove('open');
}
function renderBanco(){
  const url=localStorage.getItem('bancoScriptUrl')||'';
  const $body=document.getElementById('banco-body');
  const $sub=document.getElementById('banco-subtitle');
  if(!url){
    $sub.textContent='Sin configurar';
    $body.innerHTML=`
      <div class="inf-sec">
        <div class="inf-sec-title">Configuración</div>
        <p style="font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:20px;">
          Pega la URL de tu Google Apps Script. Los movimientos se agregan al Historial como <span style="color:#F59E0B;font-weight:600;">Sin categorizar</span> y tú los categorizas con un toque.
        </p>
        <div class="fg"><label>URL del script</label><input class="fi" type="url" id="banco-url-input" placeholder="https://script.google.com/macros/s/..."></div>
        <button class="btn-submit" onclick="guardarBancoUrl()">Guardar y conectar</button>
      </div>`;
    return;
  }
  const pend=getAll().filter(t=>t.pendiente===true).length;
  $sub.textContent='Conectado';
  $body.innerHTML=`
    <div class="inf-sec">
      <div style="background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px;">
        <div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;font-weight:600;margin-bottom:10px;">Estado actual</div>
        ${pend>0
          ?`<div style="font-size:17px;font-weight:700;color:#F59E0B;margin-bottom:4px;">${pend} sin categorizar</div><div style="font-size:12px;color:var(--text3);">Ve al Historial y toca cada movimiento para asignarle una categoría</div>`
          :`<div style="font-size:17px;font-weight:700;color:var(--green);">Al día</div><div style="font-size:12px;color:var(--text3);margin-top:4px;">Todos los movimientos están categorizados</div>`}
      </div>
      <button class="btn-submit" onclick="sincronizarAhora(this)">Sincronizar ahora</button>
      ${pend>0?`<button class="banco-url-reset" style="color:var(--red);margin-top:4px;" onclick="eliminarTodosPendientes()">Eliminar todos los pendientes (${pend})</button>`:''}
      <button class="banco-url-reset" onclick="resetBancoUrl()">Cambiar URL del script</button>
    </div>`;
}
function sincronizarAhora(btn){
  const url=localStorage.getItem('bancoScriptUrl');
  if(!url)return;
  if(btn)btn.textContent='Buscando...';
  fetch(url)
    .then(r=>r.json())
    .then(items=>{
      const count=_importItems(items);
      updateBadge();renderBanco();renderInicio();
      showToast(count>0?(count===1?'1 movimiento importado':`${count} movimientos importados`):'Sin movimientos nuevos');
    })
    .catch(()=>{if(btn)btn.textContent='Sincronizar ahora';showToast('No se pudo conectar',true);});
}
function guardarBancoUrl(){
  const v=(document.getElementById('banco-url-input')||{}).value||'';
  if(!v.trim())return;
  localStorage.setItem('bancoScriptUrl',v.trim());
  renderBanco();
  setTimeout(()=>sincronizarAhora(),200);
}
function resetBancoUrl(){
  if(!confirm('¿Desvincular el script de Gmail?'))return;
  localStorage.removeItem('bancoScriptUrl');
  renderBanco();
}
function eliminarTodosPendientes(){
  const pend=getAll().filter(t=>t.pendiente===true);
  if(!pend.length)return;
  if(!confirm(`¿Eliminar los ${pend.length} movimientos pendientes? Úsalo si ya los tienes ingresados manualmente.`))return;
  saveData(getAll().filter(t=>t.pendiente!==true));
  updateBadge();renderBanco();renderInicio();
  showToast(`${pend.length} pendientes eliminados`);
}

// ══════════════════════════════════════
//  INIT
// ══════════════════════════════════════
(function(){
  const h=new Date();mesIni=mesRes=mesHist=detectarMes(h);
  loadData();renderInicio();
  updateBadge();
  setTimeout(autoImportarBanco,1200);
})();
</script>
</body>
</html>
